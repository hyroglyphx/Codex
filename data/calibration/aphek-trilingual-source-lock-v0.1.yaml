calibration_value:
  - "Local Canaanite can occupy the vernacular column beside Sumerian and Akkadian in a Late Bronze scribal school."
  - "Aphek supplies an external comparison to Ugarit's polyglot lexical pedagogy."
  - "The small fragment tests how much crosswalk value survives when layout is secure but lexical rows are damaged/incomplete."
  - "The wider Aphek archive joins cuneiform, Egyptian and Hittite materials in one small site, making site-level multilinguality distinct from object-level trilinguality."

