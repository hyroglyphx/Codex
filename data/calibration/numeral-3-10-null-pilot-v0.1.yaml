    forms:
      3: "*ɬalāθ-"
      4: "*ʔarbaʕ-"
      5: "*χam(i)s-"
      6: "*sidθ-"
      7: "*t͡sabʕ- / *sabʕ-"
      8: "*θamāniy-"
      9: "*tisʕ-"
      10: "*ʕaɬar-"
    strict_hits: [7]
    broad_hits: [7]

  Egyptian:
    family: Afroasiatic-Egyptian
    forms:
      3: "ḫmt-w"
      4: "fd-w"
      5: "diw"
      6: "śrś-w / śiś-w"
      7: "śfḫ-w"
      8: "ḫmn-w"
      9: "pśḏ-w"
      10: "mḏ-w"
    strict_hits: [6,7]
    broad_hits: [6,7]
