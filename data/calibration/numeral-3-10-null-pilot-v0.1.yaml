dataset: numeral-3-10-null-pilot
version: 0.1.0
updated: 2026-09-21
status: PILOT_NOT_SIGNIFICANCE_CLAIM
target: strict-C7-feature-enrichment

feature_definition:
  strict:
    onset: "sibilant / affricated-sibilant class"
    later_segment: "[p,b,f,β,w]"
  broad:
    onset: "sibilant / coronal-sibilant class"
    later_segment: "[p,b,f,β,w,m]"
  frozen_before_counting: true
  note: >
    This pilot uses the previously frozen project feature. It does not modify the
    feature after seeing the matrix.

scope:
  digits: [3,4,5,6,7,8,9,10]
  reason_for_3_to_10: >
    These are the digits currently covered by directly recoverable comparable
    source tables across the pilot nodes. One and two are excluded from this
    first statistical pass rather than filled from memory.
  nodes:
    - Proto-Semitic
    - Egyptian
    - Proto-Indo-European
    - Sumerian
  nested_control:
    Proto-Berber: "recorded separately because its reconstruction of seven is disputed and because Afroasiatic branch non-independence must be modeled."

sources:
  proto_semitic:
    url: https://onlinelibrary.wiley.com/doi/full/10.1111/1467-968x.70003
    note: "Suchard 2026, Table 1 cardinal stems one-ten in Proto-Semitic."
  afroasiatic_comparison:
    url: https://www.scribd.com/document/862200899/Dispersals-and-Diversification-Linguistic-and-Serangeli-Matilde-Olander-Thomas-Eds-10-1163-9789004416192-2020-Jan-01-Koninklijke-Brill
    note: "Bjørn chapter, table of Northern Afro-Asiatic numerals and sections on PIE six/seven."
  pie_seven:
    url: https://lrc.la.utexas.edu/lex/master/1698
    note: "UT Austin Indo-European Lexicon, PIE septm 'seven'."
  sumerian:
    url: https://oracc.museum.upenn.edu/dcclt/signlists/Q000154.193.3
    note: "ORACC Ea sign list entries for Sumerian numeral readings four-ten."
  proto_berber_control:
    url: https://www.scribd.com/document/1004497639/Korangy-Alireza-Bensoukas-Karim-Eds-the-Handbook-of-Berber-l
    note: "Handbook of Berber chapter reports Prasse/Blažek reconstruction; five-nine may represent early Semitic loan stratum."

