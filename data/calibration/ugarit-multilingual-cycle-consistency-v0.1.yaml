copy_covariance:
  quadrilingual_vocabulary_family:
    reported_copy_count: 8
    languages: [Sumerian, Akkadian, Hurrian, Ugaritic]
    writing_mode: syllabic_cuneiform
    use: >
      Compare lexical-row survival, spelling variation, omissions and damage across
      copies before treating any one tablet as the complete lexical state.
    rule: "eight copies are one scribal tradition with internal covariance, not eight independent language-family witnesses"

anchored_cycle_examples:
  - id: UG-CYC01
    name: bunušu_man_cycle
    level: lexical_semantic_cross_script
    path:
      - "alphabetic Ugaritic bnš"
      - "syllabic Ugaritic bu-nu-šu"
      - "Akkadian a-mi-lu in RS 20.149 lexical row"
      - "semantic address MAN"
      - "alphabetic Ugaritic bnš"
    support:
      - "CDLI RS 20.149 preserves a-mi-lu = Hurrian tar-šu-wa-an-ni = Ugaritic bu-nu-šu in repeated lexical rows."
      - "Specialist Ugaritic grammars pair alphabetic bnš with syllabic bu-nu-šu and gloss it as man."
    expected_residual: >
      Ugaritic alphabetic writing suppresses vowels that syllabic Ugaritic makes visible;
      semantic equivalence with Akkadian is not phonetic identity.
    status: anchored_cycle

  - id: UG-CYC02
    name: alphabet_to_syllabic_to_lexicon_cycle
    level: sign_to_lexeme_multiscale
    path:
      - "UGA_ALPHA sign inventory"
      - "KTU 5.14 Akkadian syllabic pronunciation approximations"
      - "UGA_SYL fully vocalized forms in polyglot vocabularies"
      - "UGA_ALPHA lexical spellings in alphabetic corpus"
    status: structural_cycle
    caveat: >
      This is a cross-granularity consistency cycle, not a claim that KTU 5.14
      directly spells every lexical item in the quadrilingual vocabularies.

  - id: UG-CYC03
    name: semantic_quadrilateral
    level: lexical_equivalence
    path: [SUM_SYL, AKK_SYL, HUR_SYL, UGA_SYL]
    status: ancient_crosswalk_family
    test: >
      For rows surviving across multiple vocabulary copies, pairwise mappings should
      close around the four-language loop without requiring incompatible semantic states.

cycle_metrics:
  - closure_success
  - damaged_edge_count
  - lexical_semantic_residual
  - phonological_approximation_residual
  - copy_to_copy_variance
  - script_loss_or_gain
  - dependency_corrected_edge_count

frozen_invariants:
  - "same language can be written in more than one script state"
  - "same cuneiform medium can encode alphabetic and syllabic systems"
  - "lexical equivalence does not imply cognacy"
  - "fully vocalized syllabic Ugaritic is a calibration bridge to consonantal alphabetic Ugaritic"
  - "polyglot copies form a covariance family, not independent votes"
  - "cycle consistency is strongest when paths traverse genuinely different representation modes"

