dataset: ugarit-multilingual-cycle-consistency
version: 0.1.0
updated: 2026-09-22
status: SOURCE_LOCKED_FIRST_GRAPH
nexus_id: RN13

purpose: >
  Represent Ugarit as a multilingual archive graph rather than a single bilingual
  object. The graph tests whether independent scribal routes converge on compatible
  Ugaritic phonological, lexical and semantic states.

sources:
  - id: SBL_GRAMMAR_UGARITIC
    url: https://www.sbl-site.org/wp-content/uploads/2024/11/9781628374513_txt.pdf
    role: >
      Specialist grammar stating that nine languages are attested at Ugarit,
      that polyglot vocabularies were part of scribal education, and that eight
      copies of a Sumerian-Akkadian-Hurrian-Ugaritic vocabulary survive.
  - id: MNAMON_UGARITIC
    url: https://mnamon.sns.it/index.php?id=30&lang=en&page=Scrittura
    role: >
      Specialist script overview; KTU 5.14 maps Ugaritic consonants to Akkadian
      syllabic signs intended to render pronunciation.
  - id: CDLI_RS_20_149
    url: https://cdli.earth/artifacts/332946
    role: >
      Digital transliteration of a quadrilingual lexical witness, including
      Akkadian, Hurrian and syllabically written Ugaritic columns.
  - id: USC_UGARITIC_TEXTS
    url: https://dornsife.usc.edu/wsrp-temp/wp-content/uploads/sites/155/2023/05/Ugaritic-Texts.pdf
    role: >
      Identifies KTU 5.14 / RS 19.159 as a scribal exercise with Ugaritic alphabet
      plus syllabic/phonetic equivalents.
  - id: USER_MULTILINGUAL_SURVEY
    role: contextual_inventory
    note: >
      The supplied survey lists Ugarit bilinguals involving Akkadian-Hittite,
      Akkadian-Hieroglyphic Luwian, Sumerian-Akkadian, Ugaritic-Akkadian,
      plus trilingual and quadrilingual lexical/literary combinations.

