dataset: numeral-1-10-source-locked
version: 0.2.0
updated: 2026-09-21
status: SOURCE_LOCKED_WITH_TYPED_UNCERTAINTY

purpose: >
  Extend the numeral carrier experiment from digits 3-10 to 1-10 and add
  Proto-Kartvelian, Uralic branch controls, Hurrian, Etruscan, Basque and Iberian.
  Every row is typed by reconstruction/attestation status and may be excluded
  from statistical counting when the value assignment or ancestral level is insecure.

feature_definition:
  strict:
    onset: "sibilant or affricated-sibilant class"
    later_segment: "[p,b,f,φ,β,w]"
  broad:
    onset: "sibilant or coronal-sibilant class"
    later_segment: "[p,b,f,φ,β,w,m]"
  morphology_policy: >
    Primary counting uses ROOT/STEM-NORMALIZED forms and excludes transparent
    inflectional endings when these are independently identifiable.
    Surface-form counts are retained only as a sensitivity analysis.
  frozen_before_v0_2_counting: true

sources:
  proto_semitic:
    url: https://onlinelibrary.wiley.com/doi/full/10.1111/1467-968x.70003
    note: "Suchard 2026, Table 1 gives Proto-Semitic cardinal stems one-ten."
  egyptian:
    url: https://en.wikipedia.org/wiki/Egyptian_numerals
    underlying_sources: [Callender-1975, Loprieno-1995]
    note: "Used for the traditional Middle Egyptian transliterations; stem-normalized carrier excludes transparent gender/number endings where justified."
  proto_indo_european:
    url: https://lrc.la.utexas.edu/lex/master/1698
    supplementary: https://en.wiktionary.org/wiki/Reconstruction:Proto-Indo-European/o%E1%B8%B1t%E1%B9%93w
    note: "Standard PIE numeral reconstructions."
  sumerian:
    url: https://oracc.museum.upenn.edu/dcclt/signlists/Q000154.193.3
    note: "ORACC lexical/sign-list evidence for numeral readings."
  proto_kartvelian:
    sources:
      two: https://en.wiktionary.org/wiki/Reconstruction:Proto-Kartvelian/jor-
      three: https://en.wiktionary.org/wiki/Reconstruction:Proto-Kartvelian/sam-
      four: https://en.wiktionary.org/wiki/Reconstruction:Proto-Kartvelian/otxo-
      five: https://en.wiktionary.org/wiki/Reconstruction:Proto-Kartvelian/xut-
      six: https://en.wiktionary.org/wiki/Reconstruction:Proto-Kartvelian/eks%E2%82%81w-
      seven: https://en.wiktionary.org/wiki/Reconstruction:Proto-Kartvelian/%C5%A1wid-
      eight: https://en.wiktionary.org/wiki/Reconstruction:Proto-Kartvelian/arwa-
      nine: https://en.wiktionary.org/wiki/Reconstruction:Proto-Kartvelian/c%E2%82%81xar-
      ten: https://en.wiktionary.org/wiki/Reconstruction:Proto-Kartvelian/at-
    underlying_references: [Klimov-1998, Fähnrich-Sarjveladze-2000, Fähnrich-2007]
    note: >
      One is not counted as a secure Common Kartvelian reconstruction in this matrix.
      Six is explicitly analyzed in this literature stream as derived from PIE *sweks;
      seven has uncertain deeper etymology and has been compared with both Semitic and PIE.
  uralic:
    url: https://uralonet.nytud.hu/
    note: >
      Uralonet/UEW does not support treating the project's old 'Proto-Uralic seven'
      as one secure whole-family reconstruction. Finno-Permic and Ugric seven forms
      are therefore represented as separate branch controls.
  hurrian:
    source: "Ilse Wegner, Introduction to the Hurrian Language"
    web_reference: https://www.scribd.com/document/358381407/Wegner-I-Introduction-to-the-Hurrian-Language-2000-pdf
    note: "Attested Hurrian cardinal-number table; some readings remain uncertain."
  etruscan:
    url: https://journals.phil.muni.cz/graeco-latina-brunensia/article/view/42413
    supplementary: https://www.researchgate.net/publication/307735978_Etruscan_numerals
    note: >
      Modern scholarship summarizes the lower numerals, but value assignments remain
      disputed in parts of the series, especially 4/6 and to a lesser extent 7-9.
  basque:
    url: https://www.buber.net/Basque/Euskara/Larry/WebSite/basque.sketch.php
    source_author: R_L_Trask
    note: "Attested Basque lower numerals."
  iberian:
    url: https://www.researchgate.net/publication/397762969_Los_numerales_ibericos_y_su_contribucion_a_la_reconstruccion_del_protovasco
    note: >
      Ferrer i Jané and Orduña 2025 identify a candidate Iberian numeral system
      from internal combinatorics. Values are not treated as equivalent in certainty
      to securely deciphered historical languages.

