matched_feature_controls:
  description: >
    Exploratory controls use the same source-locked root-normalized strings and
    hold the sibilant-onset condition fixed while changing the later segment class.
  extended_matrix_counts:
    strict_labial:
      6: 1
      7: 7
    broad_labial:
      3: 1
      6: 1
      7: 7
    dorsal:
      6: 1
      7: 1
    nasal:
      2: 1
      3: 1
      7: 2
    rhotic:
      7: 0
      8: 2
      10: 1
  note: >
    These controls suggest the seven concentration is not reproduced by several
    simple matched segment classes in this matrix. This remains exploratory because
    feature classes were not preregistered and phonotactic base rates differ by language.

corrections_from_v0_1:
  - "Egyptian six loses strict-carrier status in the primary ROOT/STEM-normalized lane because the apparent final w belongs to the inflected surface form."
  - "Proto-Uralic seven is no longer counted as a whole-family broad hit; Finno-Permic and Ugric controls are separated."
  - "Ugric seven is explicitly flagged as Iranian-contact evidence, not an independent genealogical hit."
  - "Etruscan and Iberian are moved to an extended-candidate sensitivity layer."
