      9: "*tisʕ-"
      10: "*ʕaɬar-"
    strict_hits_root_normalized: [7]
    count_status: core

  Egyptian:
    node_type: historical_language
    family: Afroasiatic-Egyptian
    displayed_forms:
      1: "wꜥ(w)"
      2: "snwj"
      3: "ḫmtw"
      4: "jfdw"
      5: "djw"
      6: "sjsw / jsw"
      7: "sfḫw"
      8: "ḫmnw"
      9: "psḏw"
      10: "mḏw"
    stem_normalization:
      1: "wꜥ"
      2: "sn"
      3: "ḫmt"
      4: "jfd"
      5: "dj"
      6: "sjs / js"
      7: "sfḫ"
      8: "ḫmn"
      9: "psḏ"
      10: "mḏ"
    strict_hits_root_normalized: [7]
    strict_hits_surface_sensitivity: [2,6,7]
    note: >
      Surface masculine -w creates extra apparent labials. The calibrated sieve
