  - id: KTU514_P3
    region: final_decad
    status: preserved
    role: high_confidence_order_and_crosswalk

derived_observations:
  - id: KTU_D1
    status: attested_and_derived
    statement: "The tablet is an explicit ancient script-to-script crosswalk at sign/syllable resolution."
  - id: KTU_D2
    status: derived
    statement: "Crosswalk explicitness can be maximal while phonetic precision remains imperfect."
  - id: KTU_D3
    status: derived
    statement: "The same cuneiform material technology can carry two distinct encoding logics."
  - id: KTU_D4
    status: derived
    statement: "Damage gaps must be represented as missing intervals, not reconstructed rows."
  - id: KTU_D5
    status: derived
    statement: "An explicit ancient approximation is stronger calibration evidence than a modern resemblance, even when it is coarse."

new_sieve_variables_triggered:
  - crosswalk_precision
  - source_script_inventory_limits
  - target_script_inventory_limits
  - approximation_cost
  - preserved_interval
  - missing_interval
  - letter_order_position
  - syllabic_vowel
  - phoneme_feature_loss
  - medium_constant_encoding_variable

calibration_rules:
  - "Explicit scribal mapping outranks retrospective phonetic resemblance."
  - "Akkadian syllabic rendering is not assumed to be IPA-like phonetic transcription."
  - "One-to-one row alignment does not imply one-to-one phonological feature preservation."
  - "Letter-name reconstruction is a separate inference from the observed syllabic crosswalk."

next_pass:
  - "Ingest the complete 20 preserved row values from a critical edition/manual."
  - "Encode distinctive phonological features for each Ugaritic consonant and measure what the Akkadian syllabic system preserves or collapses."
  - "Compute an approximation/confusion matrix for Ugaritic consonant -> Akkadian syllabic rendering."
  - "Compare KTU 5.14 with syllabically written Ugaritic words as an external validation set."
