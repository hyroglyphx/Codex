aggregate_policy:
  global_alignment_mean: 0.936
  use: >
    The mean is descriptive only. Candidate scoring does not average all calibrators blindly.
    Each candidate draws only on calibrators relevant to its transform domains.
  transform_routing:
    phonological_approximation: [RN08, RN07, RN03]
    lexical_semantic_equivalence: [RN07, RN03, RN01]
    morphology_syntax: [RN03, RN02]
    onomastic_transposition: [RN02, RN01, RN03]
    script_register: [RN01, RN08, RN02]
    temporal_editorial_parallax: [RN02, RN07]
    damage_missingness: [RN01, RN08]
    operator_preservation: [RN03, RN01, RN02]

freeze_rule: >
  Version 0.1 remains fixed while the first candidate family is tested.
  Changes to weights require a new version and a reason trace; they may not be
  tuned retroactively to rescue a favored candidate.
