dataset: ebla-sign-lexical-first-alignment
version: 0.1.0
updated: 2026-09-21
status: ACTIVE_CALIBRATION
nexus_id: RN07
corpus: Ebla-Palace-G-lexical-traditions
period: Early-Dynastic-IIIb
approximate_date: "24th-23rd centuries BCE"
carrier: clay-tablets
languages: [Sumerian, Eblaite-Semitic]
script: cuneiform
parallax_levels: [PX5, PX6]

sources:
  - id: DCCLT_SIGNLIST_BIB
    type: scholarly_digital_corpus
    url: https://oracc2.museum.upenn.edu/dcclt/signlists/bibliography/index.html
    note: >
      DCCLT identifies the mid-third-millennium Ebla sign list as the earliest
      known cuneiform sign list with reading glosses; cites Archi 1987.
  - id: DCCLT_EBLA_SIGNLIST
    type: scholarly_digital_edition
    url: https://oracc.museum.upenn.edu/dcclt/Q000038.98
    note: "Ebla Sign List, Early Dynastic IIIb; sign/list entries with reading glosses."
  - id: CDLI_BONECHI_2016
    type: peer_reviewed_digital_article
    url: https://cdli.earth/articles/cdlj/2016-2
    note: >
      Compares multiple sources/excerpts of the Ebla bilingual lexical list and
      reconstructs their scribal/redactional relationships.
  - id: DCCLT_EBLA_EXERCISE
    type: scholarly_digital_edition
    url: https://oracc.museum.upenn.edu/dcclt/ebla/P241016
    note: "Example Early Dynastic IIIb local bilingual exercise."

witness_geometry:
  object_count: many
  archive_context: Palace-G
  crosswalk_explicitness: maximal
  alignment_granularity: [G0, G1, G2]
  local_tradition: true
  calibration_modes:
    - sign_to_reading_gloss
    - Sumerian_entry_to_Semitic_equivalent
    - parallel_copy_variant
    - scribal_redaction_sequence

