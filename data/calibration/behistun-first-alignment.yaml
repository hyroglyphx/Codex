composition_history:
  sequence:
    - stage: 1
      state: Elamite-first
      note: "Iranica reports the first main version as Elamite."
    - stage: 2
      state: Babylonian-added
      note: "Babylonian version added soon after the Elamite version."
    - stage: 3
      state: Old-Persian-added-and-edited
      note: "Old Persian added later; it represents a translated/edited definitive state and includes material not present identically in the earlier versions."
    - stage: 4
      state: Elamite-relocated-recopied
      note: "Expansion of the relief required the original Elamite inscription to be abandoned and recopied elsewhere on the monument."
    - stage: 5
      state: distributed-copies-and-translations
      note: "Copies circulated; Babylonian fragments and an Aramaic translation survive outside Behistun."
  implication: >
    Behistun is not a timeless three-column equivalence table. It is a diachronically
    layered multilingual publication process and should be modeled with temporal parallax.

alignment_rows:
  - id: BI01
    anchor: royal_titulary
    granularity: G3
    old_persian:
      transliteration: "adam Dārayavauš xšāyaθiya vazạrka xšāyaθiya xšāyaθiyānām xšāyaθiya Pārsaiy xšāyaθiya dahạyūnām"
      content: "Darius identifies himself as great king, king of kings, king in Persia, king of countries."
    elamite:
      content: "Parallel titulary: Darius, great king, king of kings, king in Persia, king of nations."
    babylonian:
      content: "Parallel royal-title complex is present, but title ordering and grammatical packaging differ."
    same_referent: true
    same_proposition: true
    same_lexicalization: false
    transform:
      - royal_title_mapping
      - word_order_recasting
      - language_specific_grammatical_packaging
    evidence_class: C0
    calibration_weight: maximal
    note: "This is a high-confidence three-language anchor."

  - id: BI02
    anchor: genealogy
    granularity: G5
    old_persian:
      content: "Hystaspes -> Arsames -> Ariaramnes -> Teispes -> Achaemenes."
    elamite:
      content: "Same genealogical chain and father-son sequence."
    babylonian:
      content: "Same genealogical chain and father-son sequence."
    same_referent: true
    same_proposition: true
    same_lexicalization: false
    transform:
      - kinship_syntax_mapping
      - anthroponym_transposition
    evidence_class: C0
    calibration_weight: maximal
    anchors: [Hystaspes, Arsames, Ariaramnes, Teispes, Achaemenes]

  - id: BI03
    anchor: achaemenid_dynastic_claim
    granularity: G5
    old_persian:
      content: "The family is called Achaemenid; from long ago it is noble and royal."
    elamite:
      content: "Parallel claim of Achaemenid family identity, antiquity, nobility and kingship."
    babylonian:
      content: "Parallel dynastic claim."
    same_referent: true
    same_proposition: true
    same_lexicalization: false
    transform:
      - dynastic_formula_mapping
      - abstract_status_vocabulary_recasting
    evidence_class: C0
    calibration_weight: high

  - id: BI04
    anchor: eight_before_ninth
    granularity: G5
    old_persian:
      content: "Eight of Darius's family were kings before him; he is the ninth; nine in succession were kings."
    elamite:
      content: "Eight earlier kings; Darius holds the ninth kingship; succession emphasized."
    babylonian:
      content: "Same numerical/dynastic proposition with language-specific wording."
    same_referent: true
    same_proposition: true
    same_lexicalization: false
    transform:
      - numeral_anchor_preservation
      - succession_formula_mapping
    evidence_class: C0
    calibration_weight: maximal
    anchors: [8, 9]

  - id: BI05
    anchor: ahuramazda_grants_kingship
    granularity: G5
    old_persian:
      content: "By the favor of Ahuramazda Darius is king; Ahuramazda bestowed the kingdom."
    elamite:
      content: "By the intercession/favor of Ahuramazda Darius exercises kingship; Ahuramazda gives kingship."
    babylonian:
      content: "Parallel proposition: Darius is king under Ahuramazda's protection/favor and receives kingship from the god."
    same_referent: true
    same_proposition: true
    same_lexicalization: false
    transform:
      - divine_name_transposition
      - causation_or_favor_formula_mapping
      - kingship_lexicon_mapping
    evidence_class: C0
    calibration_weight: maximal

  - id: BI06
    anchor: formula_says_darius_the_king
    granularity: G3
    old_persian:
      content: "The text repeatedly segments discourse with a formula equivalent to 'Darius the king says'."
    elamite:
      content: "Equivalent segmentation formula occurs, but less frequently than in Old Persian."
    babylonian:
      content: "Equivalent segmentation formula occurs, but less frequently than in Old Persian."
    same_referent: true
    same_proposition: true
    same_lexicalization: false
    transform:
      - discourse_segmentation
      - formula_frequency_shift
    evidence_class: C1
    calibration_weight: very_high
    residue: >
      Iranica notes Old Persian has substantially more paragraph-initial repetitions than
      Elamite and Babylonian. This is a measurable discourse-level divergence, not noise.

  - id: BI07
    anchor: casualty_and_capture_counts
    granularity: G5
    old_persian:
      content: "Narrative of revolts and suppression without all numerical casualty details preserved in the Babylonian/Aramaic tradition."
    elamite:
      content: "Does not uniformly match the Babylonian/Aramaic numerical elaboration."
    babylonian:
      content: "Contains additional numbers of enemies killed or captured in places where the other versions differ."
    same_referent: true
    same_proposition: partial
    same_lexicalization: false
    transform:
      - audience_specific_expansion
      - quantitative_detail_insertion
    evidence_class: C1
    calibration_weight: high
    significance: "Strong control against assuming trilingual witnesses are line-for-line equivalents."

  - id: BI08
    anchor: geographic_and_name_forms
    granularity: G2
    old_persian:
      content: "Iranian names and province names appear in Old Persian forms."
    elamite:
      content: "Many Iranian names track Old Persian more closely in dialectological form."
    babylonian:
      content: "Babylonian name forms often pattern with the later Aramaic translation rather than with Old Persian special developments."
    same_referent: true
    same_proposition: true
    same_lexicalization: false
    transform:
      - onomastic_transposition
      - dialect_filtering
      - scribal_language_adaptation
    evidence_class: C1
    calibration_weight: very_high
    significance: >
      This row is ideal for training exonym/endonym and intermediary-language transformations.

derived_observations:
