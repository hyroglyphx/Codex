    status: attested_and_derived
    statement: "The three main versions were produced in stages rather than simultaneously."
  - id: BEH_D2
    status: derived
    statement: "Translation direction and editorial revision are separate sieve variables."
  - id: BEH_D3
    status: attested_and_derived
    statement: "Paragraph/formula frequency diverges by version even when event structure remains aligned."
  - id: BEH_D4
    status: attested_and_derived
    statement: "Babylonian contains audience-specific additions and numerical detail; parallel witness does not mean lexical identity."
  - id: BEH_D5
    status: derived
    statement: "Behistun supplies both spatial parallax and temporal parallax on one monument."

