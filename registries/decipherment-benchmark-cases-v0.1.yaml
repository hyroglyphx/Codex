registry: decipherment-benchmark-cases
version: 0.1.0
updated: 2026-09-22
status: SURVEY_DERIVED_PENDING_PRIMARY_SOURCE_LOCK

purpose: >
  Build a comparative benchmark of decipherment environments. Initial entries are
  derived from the supplied multilingual-inscription survey and are intentionally
  marked pending primary/specialist source-lock before quantitative use.

variables:
  - target_script_or_language
  - anchor_object
  - language_count
  - script_count
  - crosswalk_depth
  - anchor_specificity
  - corpus_size_class
  - decipherment_outcome
  - historical_role
  - source_lock_status

cases:
  - id: DB01
    anchor_object: Behistun
    target_script_or_language: cuneiform_and_Old_Persian_reading
    languages: [Old_Persian, Elamite, Babylonian]
    crosswalk_depth: X2_X3
    decipherment_outcome: major_success
    historical_role: "survey identifies Behistun as instrumental for cuneiform decipherment"
    source_lock_status: partially_locked_elsewhere_in_Codex

  - id: DB02
