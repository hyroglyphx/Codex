negative_controls:
  - id: DBN01
    anchor_object: Byblos_corpus
    target_script_or_language: Byblos_script
    languages: [unknown]
    crosswalk_depth: X0
    decipherment_outcome: undeciphered
    historical_role: "low-crosswalk-degree adversarial control"
    source_lock_status: specialist_overview_locked

hypothesis_to_test:
  statement: >
    Higher effective crosswalk degree and greater anchor specificity should predict
    lower decipherment entropy and a higher probability of durable decipherment,
    after controlling for corpus size, damage, language identification, and dependency.
  current_status: untested
  next_step: >
    Primary-source-lock the positive benchmark cases, then assign comparable
    crosswalk-degree / depth / corpus-size variables before fitting any model.
