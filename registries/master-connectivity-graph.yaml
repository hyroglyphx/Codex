operator_overlays:
  O_BOUNDARY:
    corpora: [Atrahasis, Gilgamesh, Genesis, Ninkasi, material_semantic_bitumen]
    rule: "contain / separate / preserve / control permeability"
  O_ORDER:
    corpora: [Enuma-Elish, Genesis-1, Vedic-creation-controls, Maat]
    rule: "differentiate / classify / assign / stabilize"
  O_CROSS:
    corpora: [Semitic_EBR_family, travel_route_material, ARGO]
    rule: "boundary / passage / transit / beyond"
  O_GENERATE:
    corpora: [Semitic_BN, Akkadian_aplu, Egyptian_ms, IE_gen_jan]
    rule: "source / birth / offspring / succession"
  O_CUSTODY:
    corpora: [Sumerian-in-Akkadian, Hattic-in-Hittite, scriptural-liturgical-languages, Roman-administration-in-successor-polities]
    rule: "carrier survives change of speaker/institution"
  O_RETURN:
    corpora: [Gilgamesh, ARGO, scriptural_repetition, Relay_Kernel]
    rule: "transform / preserve identity / return with residue"
  O_TRANSLATION:
    corpora: [Septuagint, Targum, Peshitta, Vulgate, Letoon, Behistun, Rosetta, Karatepe, Pyrgi]
    rule: "proposition persists while lexical/syntactic carrier changes"
  O_PACE:
    corpora: [Homeric-hexameter, Hebrew-poetic-cadence, Septuagint, Targum, Vulgate, Jubilees, Deuteronomy]
    rule: "measure whether meter, cadence, cola, formula density, clause timing, and recurrence survive translation or rewriting"
  O_RECAPITULATE:
    corpora: [Genesis, Deuteronomy, Jubilees, covenant-renewal-texts, Homeric-recensional-parallels]
    rule: "prior state -> retelling/reindexing -> renewed audience/state; distinguish literal repetition from functional restart"
  O_ARITY:
    corpora: [Egyptian-sign-role-spectrum, Sumerian-logographic-carriers, Akkadian-readouts, Ugaritic, Hebrew, Sanskrit, Avestan]
    rule: "index graphic arity, phonological load, root arity, morphology and semantic compression as separate coordinates; spectral order does not imply chronology"
  O_SYNCHRONIZE:
    corpora: [Books-of-Jeu, Chaldaean-Oracles, Hekhalot-controls, Egyptian-gate-text-controls]
    rule: "test whether independent modalities converge on one state address through name, sign/seal, number, gesture, sequence and spatial threshold"
  O_PROJECT:
    corpora: [Plato-Cave-control, textual-transmission, astronomical-analogy]
    rule: "infer constraints on hidden states from convergent projections while keeping substrate claims explicitly bounded"
  O_CONCORDANT_REDUNDANCY:
    corpora: [Egyptian-phonetic-complements, Egyptian-determinatives, cuneiform-logogram-complements, Books-of-Jeu]
    rule: "multiple partially independent channels constrain one admissible readout or state; structural error-correction analogy only"
  O_COVARIANCE:
    corpora: [Ebla-crosswalks, Ugaritic-Akkadian-crosswalks, Rosetta, Behistun, Tell-Fekheriye, Karatepe-Cinekoy, Letoon]
    rule: "prefer relations whose transformation law remains stable across independent representations; test alternate paths for cycle consistency and prospective divergence"

