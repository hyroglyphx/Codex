connectivity_status:
  historically_connected: >
    Nodes with C0/C1 routes through translations, bilinguals, genealogy, borrowing,
    recension, script/readout continuity, or institutional custody.
  structurally_connected: >
    Nodes with C4 control routes. They are in the graph for comparison, not because
    historical transmission is asserted.
  candidate_connected: >
    C5 nodes/hypotheses remain visible but unpromoted.
  named_gap:
    - LinguaDanka
    note: "Connected only to the recovery queue because the exact dictionary is missing."

invariant:
  statement: >
    No incorporated language, text, script, nexus, or operator is allowed to float as
    an untyped resemblance. It must connect by translation, parallel witness,
    recomposition, readout/script change, borrowing, operator transposition, custody,
    substrate, genealogy, creolization/shift, or explicit structural control.


