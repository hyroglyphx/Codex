registry: recursive-reassessment
version: 0.1.0
updated: 2026-09-22
status: ACTIVE_RECURSIVE_REVIEW

purpose: >
  Revisit earlier Codex insights whenever a newer calibration object, null model,
  decipherment control, transmission witness, or operator distinction changes the
  evidentiary geometry. Earlier ideas are not merely kept or discarded; they are
  retyped as strengthened, narrowed, split, downgraded, retained-as-heuristic, or
  promoted-to-calibration.

statuses:
  - strengthened
  - narrowed
  - split
  - promoted
  - downgraded
  - retained_heuristic
  - unresolved
  - queued_for_retest

review_axes:
  - witness_provenance
  - carrier_vs_readout
  - name_identity_role_classifier_episode
  - morphology_before_normalization
  - script_language_separation
  - explicit_crosswalk
  - contact_path
  - genealogy_dependence
  - transformation_covariance
  - cycle_consistency
  - negative_controls
  - null_model
  - projection_claim_ceiling
  - operator_order

entries:
  - id: RR01
    topic: projection_bounded_inference
    previous_state: "infer hidden order from recurrent projections without claiming substrate identity"
    new_findings: [Rosetta-Nexus, Hittite-decipherment, Behistun-temporal-parallax]
    status: strengthened
    update: >
      Keep the hidden substrate bounded, but require projection independence/dependence
      to be typed. Several convergent projections that descend from one source do not
      count as independent constraints.
    new_rule: "projection convergence must be dependency-corrected"

  - id: RR02
    topic: VITRIOL_inverse_reconstruction
    previous_state: "FOCUS -> DECOMPOSE -> RECTIFY -> CROSS-PROJECT -> RECONSTRUCT"
    new_findings: [Hittite-decipherment, Rosetta-calibration, noncommuting-operator-discipline]
    status: strengthened
    update: >
      VITRIOL is now an ordered inverse pipeline. Operator order matters: morphology,
      provenance, and carrier/readout separation must occur before normalization or
      reconstruction.
    new_rule: "inverse reconstruction is order-sensitive"

  - id: RR03
    topic: synchronous_state_harmonics
    previous_state: "multiple modalities converge on one operative state"
    new_findings: [Egyptian-complementation, KTU-5.14, Tell-Fekheriye, Hittite-NINDA]
    status: strengthened
    update: >
      Recast as concordant redundancy plus dependency weighting. Multiple channels
      constrain one state, but dependent channels must not be counted as independent votes.
    new_rule: "synchrony strength = agreement x independence x precision"

  - id: RR04
    topic: work_not_fixed_text
    previous_state: "works survive as recension ecologies rather than single fixed texts"
    new_findings: [Aelian-Gilgamos, Qumran-Book-of-Giants, Behistun-version-sequence]
    status: strengthened
    update: >
      Extend from recension ecology to identity-network ecology: a figure can survive
      outside the canonical work while plot, classifier, and episode bundle change.

  - id: RR05
    topic: name_identity_role
    previous_state: "NAME != IDENTITY != ROLE"
    new_findings: [Gilgamesh-classifier-transfer, Aelian-narrative-rebinding]
    status: split
    update: >
      Expand the state tensor to NAME, ENTITY, ROLE, CLASSIFIER, EPISODE_SET,
      COMPANION_NETWORK, and RECEIVING_TRADITION.
    new_rule: "name continuity does not imply plot or classifier continuity"

  - id: RR06
    topic: attestation_not_inception
    previous_state: "surviving witness date is not origin date"
    new_findings: [Gilgamesh-beyond-cuneiform, Amarna-Arzawa-vs-Hattusa, Qumran-fragments]
    status: strengthened
    update: >
      Add distributed-witness inference: absence from one canonical corpus cannot erase
      a tradition demonstrably surviving in other languages, regions, or media.

  - id: RR07
    topic: arity_compression
    previous_state: "graphic arity, phonological load, root arity, morphology, and semantic compression are separate"
    new_findings: [Hittite-logograms, numeral-morphology-normalization]
    status: strengthened
    update: >
      Add heterogram/logogram embedding and mandatory morphology normalization before
      carrier-feature counting. Surface endings may create false arity/carrier signals.

  - id: RR08
    topic: QBL_orbit
    previous_state: "FACE/CONFRONT/RECEIVE plus unresolved CENTER/MIDDLE branch"
    new_findings: [Aramaic-root-orbit, Arabic-root-orbit, MURUB4-scribal-overlap]
    status: strengthened
    update: >
      The semantic operator orbit is historically anchored. Ancient carrier convergence
      raises the CENTER/INTERFACE question, but common etymology remains unresolved.
    claim_ceiling: C4_for_center_interface_common_origin

  - id: RR09
    topic: ASIS_normalization
    previous_state: "cross-language normalized discovery window with several negative controls"
    new_findings: [Hittite-decipherment-heuristic-vs-final-etymology]
    status: retained_heuristic
    update: >
      A heuristic can be operationally useful without being historically correct.
      ASIS is retained to surface candidates, then every candidate must re-enter with
      native onset, morphology, chronology, and contact path.

  - id: RR10
    topic: HSS_ear_wisdom
    previous_state: "Ebla/Akkadian/Ugaritic candidate lane"
    new_findings: [Ebla-orthography, specialist-Semitic-comparison, Ugaritic-grammar]
    status: promoted
    update: >
      H-S-S lane is strongly supported as a historical-semantic comparison.
      The deeper H-S biradical kernel is not promoted and is now more tightly constrained
      because the third radical shows repeated stability.

  - id: RR11
    topic: numeral_seven_carrier
    previous_state: "sibilant-plus-labial enrichment candidate"
    new_findings: [root-normalization, genealogy-collapse, contact-model, generative-null]
    status: narrowed
    update: >
      Seven remains the strongest concentration in the current source-locked matrix,
      but evidentiary strength depends heavily on historical dependence and node-specific
      phonotactic base rates.
    new_rule: "count historical dependency units, not language names"

  - id: RR12
    topic: exposed_royal_infant_motif
    previous_state: "Sargon/Moses and related birth-rescue parallels"
    new_findings: [Aelian-Gilgamos, exposed-royal-infant-operator-matrix]
    status: strengthened
    update: >
      Separate identity carrier from mobile episode. Exposure, rescue, gardener/adoption,
      hidden birth, and royal destiny may move as a motif package and be rebound to
      different named figures.
    new_operator: ONOMASTIC_EPISODIC_REBINDING

  - id: RR13
    topic: water_yields_passage_sovereignty_shift
    previous_state: "Cyrus/Babylon, Exodus, Joshua and related water-passage operators"
    new_findings: [operator-preservation-calibration, classifier-transfer-discipline, water-yields-passage-sovereignty-matrix]
    status: strengthened
    update: >
      Preserve WATER_YIELDS -> PASSAGE -> SOVEREIGNTY_SHIFT as an operator comparison.
      Do not promote transmission from operator similarity alone; require route, chronology,
      and intermediate witness or a historically connected matrix.

  - id: RR14
    topic: gird_loins_embodied_idiom
    previous_state: "GATHER -> BOUND -> MOBILE -> READY"
    new_findings: [Tell-Fekheriye-operator-preservation, Hittite-decipherment-covariance, Isaiah-45-inverse-loins-operator, gird-loins-embodied-operator-retest]
    status: strengthened
    update: >
      Embodied operator can remain stable while lexical wording changes. Translation
      comparison should prioritize body-action sequence, syntax, and usage context over
      English idiom identity.

  - id: RR15
    topic: referential_stratification
    previous_state: "person/office/retinue/people/polity/dynasty levels"
    new_findings: [classifier-transfer, route-indexed-identity, narrative-rebinding]
    status: split
    update: >
      Add an orthogonal identity axis: ENTITY, ROLE, CLASSIFIER, EPISODE, NETWORK.
      Referential R-level and identity/classifier state must not be collapsed.

  - id: RR16
    topic: diachronic_translation_lattice
    previous_state: "translations form dependent genealogies; count lineages not editions"
    new_findings: [numeral-dependency-null, Behistun-version-sequence]
    status: strengthened
    update: >
      Translation genealogy and linguistic genealogy now share one dependency principle:
      correlated descendants cannot be counted as independent confirmations.

  - id: RR17
    topic: earlier_harmonic_numeric_patterns
    previous_state: "exploratory modular/residue correspondences across symbolic corpora"
    new_findings: [numeral-preregistered-feature-discipline, generative-null, negative-controls]
    status: queued_for_retest
    update: >
      Re-run older numerical claims with frozen operators, morphology/representation rules,
      explicit nulls, and feature-selection correction. Post-hoc residue patterns remain
      exploratory until they survive the same adversarial standard now used for numeral seven.

  - id: RR18
    topic: route_indexed_identity_and_admissibility
    previous_state: "same place/object under different route, phase, boundary, or jurisdiction is a distinct encounter"
    new_findings: [Rosetta-parallax, Gilgamesh-receiving-traditions, Hittite-distributed-witnesses]
    status: strengthened
    update: >
      Extend route-indexing from spatial encounters to textual identities: the same name,
      sign, or work reached through a different scribal/ritual/linguistic route may be a
      distinct historical state rather than a duplicate witness.

  - id: RR19
    topic: Egyptian_Hittite_treaty
    previous_state: "distributed bilingual legal kernel / crossed transport control"
    new_findings: [Hittite-decipherment-node, Rosetta-distributed-parallax, RN10-first-alignment]
    status: promoted
    update: >
      Move RN10 upward in the calibration queue. It can test same diplomatic event/text
      across separate carriers, languages, locations, legal formulae, divine witnesses,
      and institutional settings.

  - id: RR20
    topic: embodied_operator_reversibility
    previous_state: "girding marks readiness"
    new_findings: [Isaiah-45-loosen-loins-before-Cyrus]
    status: promoted
    update: >
      Readiness imagery is reversible: binding/girding raises action-capacity while
      loosening can mark disarmament or loss of royal capacity. This supplies a
      predictive inverse control for embodied-idiom studies.

  - id: RR21
    topic: boundary_substitution
    previous_state: "exposure/rescue motifs compared by whole episode"
    new_findings: [Sargon-river, Moses-Nile, Gilgamos-height-eagle]
    status: promoted
    update: >
      The liminal boundary can change medium while the exposure/rescue function survives.
      Track WATER, HEIGHT/AIR, WILDERNESS, and other boundary classes separately from
      the operator EXPOSE -> RESCUE -> DESTINY.

  - id: RR22
    topic: legal_kernel_vs_prestige_frame
    previous_state: "distributed treaty witnesses preserve common diplomatic event"
    new_findings: [RN10-Egyptian-Hittite-treaty-alignment, Behistun-audience-specific-expansion]
    status: promoted
    update: >
      Legal/operator covariance can remain high while local royal-prestige framing diverges.
      This distinction should be applied to imperial inscriptions, covenant texts, and
      historiographic retellings.

  - id: RR23
    topic: decipherment_success_conditions
    previous_state: "Rosetta-style crosswalks and Hittite covariance treated as separate calibration cases"
    new_findings: [Byblos-negative-control, Ugarit-multilingual-hub, multilingual-inscription-survey]
    status: promoted
    update: >
      Decipherment should now be modeled through effective crosswalk degree, anchor density,
      crosswalk depth, corpus covariance, and value-assignment entropy. Byblos becomes the
      control for a low-degree system with no secure explicit crosswalk.
    new_rule: "a decipherment model must reduce uncertainty by independent constraints and predict holdout material"

  - id: RR24
    topic: ancient_script_lattice
    previous_state: "exact-sign, phonological, cross-script, spatial and diachronic comparison"
    new_findings: [Byblos-sign-frequency-chart, medium-conditioned-variants]
    status: strengthened
    update: >
      Add token frequency, medium distribution, variant-series testing, value-assignment entropy,
      and holdout prediction. Surface glyph count must be separated from normalized grapheme count.
    new_rule: "surface glyph != grapheme != phonetic value"

  - id: RR25
    topic: Ugarit_crosswalk_density
    previous_state: "KTU 5.14 treated as a single high-value pronunciation crosswalk"
    new_findings: [Ugarit-bilingual-trilingual-quadrilingual-survey]
    status: promoted
    update: >
      Recast Ugarit as a multilingual archive hub rather than a single crosswalk object.
      Intersecting language/script paths create cycle-consistency tests unavailable in isolated bilinguals.

  - id: RR26
    topic: Rosetta_object_value
    previous_state: "multilingual objects privileged for calibration"
    new_findings: [anchor-density-model, Byblos-control]
    status: narrowed
    update: >
      The value of a Rosetta object is not multilinguality by itself, but the number,
      specificity, independence and granularity of the crosswalk edges it contributes.
    new_rule: "crosswalk quality outranks language count"

next_revisit_queue:
  - Byblos_sequence_graph_and_holdout_design
  - Ugarit_multilingual_cycle_consistency
  - Aphek_trilingual_source_lock
  - older_harmonic_numeric_null_retests
  - flood_name_orbit_plus_identity_tensor
  - RN04_Karatepe_Cinekoy_alignment
