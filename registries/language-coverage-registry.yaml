    primary: [Sumerian, Akkadian, Hebrew, Aramaic-Syriac, Classical-Greek, Latin, Hittite, Luwian, Egyptian-Coptic, Old-Persian, Elamite, Phoenician-Punic, Etruscan, Lemnian, Sanskrit]
