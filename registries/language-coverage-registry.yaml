    density: D4
    primary: [Hebrew, Aramaic-Syriac, Classical-Greek, Latin, Akkadian, Sumerian, Sanskrit]
    note: "Calibrates textual continuity across Masoretic Hebrew, Septuagint, Targumic Aramaic, Peshitta/Syriac, Vulgate/Latin and older/adjacent operator corpora. Direct transmission and structural/operator correspondence are always separately typed."
