registry: language-coverage
version: 0.1.0
updated: 2026-09-20
status: GENERATED_LIVING_REGISTRY

coverage_scale:
  D0: absent
  D1: registered
  D2: structured
  D3: active_study
  D4: dense_crosslinked
  D5: instrumented_end_to_end

scoring_rule: >
  Coverage measures density inside this research corpus, not general scholarly
  knowledge of the language. Raise a level only when new corpus objects,
  transformations, controls, witnesses, or end-to-end fixtures are actually added.

path_density:
  - id: P01
    path: Mesopotamia-Syria-Levant
    level: D4
    note: Core carrier/readout, Semitic calibration, operator panels, bilingual and contact work.
  - id: P02
    path: Hurro-Urartian-and-Hattic-Hittite
    level: D3
    note: Strong control architecture; several explicit mechanisms, fewer filled witness sets.
  - id: P03
    path: Anatolian-branch-and-script-mode
    level: D3
    note: Hittite/Luwian are developed; western Anatolian languages are unevenly populated.
  - id: P04
    path: Aegean-Cyprus
    level: D3
    note: Mycenaean-to-alphabetic script-state logic is strong; Eteocypriot remains boundary-status.
  - id: P05
    path: Greek-IE-case-and-root-depth
    level: D4
    note: Case syncretism, root/stem operators, Sanskrit/Latin/Old Iranian controls are cross-linked.
  - id: P06
    path: Iranian-Achaemenid
    level: D3
    note: Behistun/Susa multilingual control plus Old Persian/Avestan/Sanskrit depth lane.
  - id: P07
    path: Western-Mediterranean
    level: D3
    note: Pyrgi, Etruscan/Lemnian, numeral controls, script transport; Iberian/Basque remain lighter.
  - id: P08
    path: Nile-Northeast-Africa
    level: D3
    note: Egyptian/Coptic is dense; Meroitic and Berber function mainly as controlled adjacent lanes.
  - id: P09
    path: Arabia
    level: D2
    note: Arabic/MSA are structured; Old North Arabian and Ancient South Arabian are newly incorporated.
  - id: P10
    path: Distant-external-controls
    level: D2
    note: Kartvelian, Uralic, Tamil, Baltic and related controls exist mainly to stress-test broad invariants.

