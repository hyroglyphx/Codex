registry: rosetta-nexus-calibration
version: 0.1.0
updated: 2026-09-21
status: ACTIVE_CALIBRATION

purpose: >
  Index ancient multilingual, multiscript, lexical, phonetic, and parallel-text witnesses
  as calibration objects for crosswise transformation analysis. These witnesses are used
  to learn how real historical representation changes behave before speculative relations
  are promoted.

parallax_levels:
  PX0:
    name: SAME_OCCURRENCE_MULTIROLE
    definition: "One witnessed occurrence supports multiple declared readouts or sign roles."
    examples: [Egyptian-polyvalent-sign, cuneiform-polyvalent-sign]
  PX1:
    name: SAME_OBJECT_SCRIPT_REGISTER
    definition: "One physical object carries closely related content across different scripts/registers within the same linguistic-cultural system."
    examples: [Rosetta-Egyptian-hieroglyphic-Demotic]
  PX2:
    name: SAME_OBJECT_CROSS_LANGUAGE
    definition: "One physical object carries parallel or corresponding content in different languages."
    examples: [Rosetta-Egyptian-Greek, Behistun, Tell-Fekheriye, Letoon]
  PX3:
    name: COLOCATED_OBJECT_SET
    definition: "A deliberately associated object set carries parallel or near-parallel multilingual content."
    examples: [Pyrgi-tablets]
  PX4:
    name: SAME_TEXT_EVENT_DISTRIBUTED_OBJECTS
    definition: "Related copies or versions of one institutional text/event survive on different objects, locations, or script systems."
    examples: [Egyptian-Hittite-treaty-tradition, Memphis-decree-copy-network]
  PX5:
    name: EXPLICIT_SCRIBAL_CROSSWALK
    definition: "A lexical, sign, syllabic, or pronunciation table explicitly maps one representation to another."
    examples: [Ebla-reading-glosses, Sumerian-Akkadian-lexical-lists, Ugaritic-KTU-5-14]
  PX6:
    name: ARCHIVAL_RELAY
    definition: "A later copy, recension, translation, or administrative relay preserves a historically linked but non-colocated state."
    examples: [Behistun-Aramaic-relay, later-lexical-traditions]
  PX7:
    name: STRUCTURAL_CONTROL
    definition: "Crosswise comparison without demonstrated historical relay; used only as a null or operator control."
    examples: [independent-multimodal-ritual-control]

decipherment_depth:
  PX-D0:
    name: KNOWN_SCRIPT_UNKNOWN_LANGUAGE
    definition: "Script values are substantially readable, but the encoded language remains unidentified."
  PX-D1:
    name: LOGOGRAPHIC_SEMANTIC_ANCHORS
    definition: "Known logograms or heterograms provide secure semantic anchors inside the unknown language."
  PX-D2:
    name: CANDIDATE_COGNATE_NETWORK
    definition: "Candidate lexical correspondences are proposed across historically relevant languages."
  PX-D3:
    name: MORPHOSYNTACTIC_CONFIRMATION
    definition: "Candidate readings cohere with recurring morphology and syntax."
  PX-D4:
    name: CORPUS_COVARIANCE
    definition: "The hypothesis propagates across the corpus and supports language-family classification."

parallax_rule: >
  PX level is a transformation-distance descriptor, not a confidence ranking.
  Evidence class, witness quality, chronology, and relation type remain separate.

sieve_variables:
  witness_identity:
    - nexus_id
    - object_id
    - witness_date
    - findspot
    - provenance
    - authority_or_institution
  carrier_geometry:
    - carrier_class
    - material_substrate
    - object_count
    - colocation
    - monument_or_archive_context
    - spatial_layout
    - direction_order
    - damagedness
    - completeness
  representation:
    - language_count
    - languages
    - script_count
    - scripts
    - register_count
    - registers
    - sign_role_inventory
    - graphic_arity
    - phonological_load
    - root_visibility
    - classifier_determinative_channel
  alignment:
    - parallax_level
    - alignment_granularity
    - crosswalk_explicitness
    - parallelism_type
    - same_referent
    - same_proposition
    - same_lexicalization
    - translation_direction_known
    - sequence_correspondence
    - omission_expansion_reordering
  anchors:
    - names
    - titles
    - numerals
    - dates
    - divine_names
    - place_names
    - legal_formulae
    - repeated_formulae
    - rare_lexemes
  transform:
    - script_transform
    - phonological_transform
    - morphological_transform
    - syntactic_transform
    - semantic_transform
    - register_transform
    - institutional_transform
  validation:
    - covariance
    - cycle_consistency
    - divergence_rate
    - residue
    - conflict
    - negative_control
    - evidence_class
    - calibration_weight
    - ontology_claim_ceiling

alignment_granularity:
  G0: sign_or_grapheme
  G1: phoneme_or_syllable
  G2: lexeme_or_name
  G3: phrase_or_formula
  G4: clause_or_sentence
  G5: proposition
  G6: section
  G7: document_or_event

parallelism_types:
  - literal_or_near_literal
  - functional_translation
  - register_recasting
  - paraphrase
  - expansion
  - compression
  - legal_or_institutional_equivalence
  - pronunciation_gloss
  - lexical_equation
  - sign_equation
  - recension
  - later_relay

