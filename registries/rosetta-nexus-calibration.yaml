processing_order:
  - LOCK_WITNESS
  - ASSIGN_PARALLAX_LEVEL
  - INDEX_CARRIER_GEOMETRY
  - ALIGN_ANCHORS
  - ALIGN_BY_GRANULARITY
  - TYPE_PARALLELISM
  - MEASURE_TRANSFORMS
  - TEST_COVARIANCE
  - TEST_CYCLE_CONSISTENCY
  - MEASURE_DIVERGENCE
  - RECORD_RESIDUE
  - APPLY_NEGATIVE_CONTROLS
  - PROMOTE_OR_SURGERY

governing_invariants:
  - "same object does not imply literal translation"
  - "same event does not imply same lexicalization"
  - "same script does not imply same language"
  - "same language does not imply same register"
  - "co-location strengthens historical linkage but does not erase divergence"
  - "explicit ancient crosswalk outranks retrospective resemblance for calibration"
  - "parallax depth is not confidence"


